<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Water Dispenser</title>
<script>
  // set theme before first paint to avoid a flash
  try { document.documentElement.dataset.theme = localStorage.getItem('swd_theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><span class="logo">💧</span> Smart Water Dispenser <span class="sub">Management</span></h1>
  <div class="right">
    <span id="conn" class="pill ok">● Live</span>
    <span id="updated" class="muted"></span>
    <button id="themeBtn" class="icon" title="Toggle dark / light" aria-label="Toggle theme">🌙</button>
    <button id="exportBtn" title="Download dispense history as CSV">⬇ Export CSV</button>
    <button id="usersBtn" hidden>👥 Users</button>
    <button id="pwBtn" title="Change your password">🔑</button>
    <span id="who" class="who"></span>
    <button id="logout">Sign out</button>
    <button id="addBtn" class="primary" hidden>+ Add dispenser</button>
  </div>
</header>

<main>
  <section class="cards" id="cards"></section>

  <section class="panel toolbar-panel">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search name or location…  ( / )" aria-label="Search dispensers">
      <select id="filter" aria-label="Filter by status">
        <option value="">All statuses</option>
        <option>OK</option><option>LOW</option><option>EMPTY</option><option>OFFLINE</option><option>DISABLED</option>
      </select>
      <select id="sort" aria-label="Sort">
        <option value="name">Sort: Name</option>
        <option value="level">Sort: Lowest level</option>
        <option value="status">Sort: Needs attention</option>
        <option value="usage">Sort: Most used today</option>
      </select>
      <div class="seg" role="group" aria-label="View">
        <button id="vCards" data-view="cards">▦ Cards</button>
        <button id="vTable" data-view="table">☰ Table</button>
      </div>
    </div>
    <div id="list"></div>
  </section>

  <section class="grid">
    <div class="panel">
      <div class="panel-head"><h2>Open alerts</h2></div>
      <ul id="alerts" class="alerts"></ul>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Usage – last 7 days (L)</h2></div>
      <svg id="daily" class="chart" viewBox="0 0 400 180"></svg>
    </div>
    <div class="panel full">
      <div class="panel-head"><h2>Usage today by hour (L)</h2></div>
      <svg id="hourly" class="chart" viewBox="0 0 1200 180"></svg>
    </div>
  </section>
</main>

<!-- add / edit -->
<dialog id="dlg">
  <form id="form" autocomplete="off">
    <h3 id="dlgTitle">Add dispenser</h3>
    <label>Name <input name="name" required maxlength="80"></label>
    <label>Location <input name="location" required maxlength="120"></label>
    <label>Capacity (L) <input name="capacity_l" type="number" min="1" step="0.1" value="20" required></label>
    <label>Current level (L) <input name="level_l" type="number" min="0" step="0.1" value="0"></label>
    <p id="formErr" class="err"></p>
    <div class="actions"><button type="button" data-close>Cancel</button><button type="submit" class="primary">Save</button></div>
  </form>
</dialog>

<!-- details -->
<dialog id="detail" class="wide">
  <div class="dhead"><div><h3 id="dName"></h3><div class="muted" id="dSub"></div></div><button data-close class="icon" aria-label="Close">✕</button></div>
  <div class="dstats" id="dStats"></div>
  <h4>Water level – last 24 hours</h4>
  <svg id="dChart" class="chart" viewBox="0 0 560 200"></svg>
  <h4>Recent dispenses</h4>
  <ul id="dEvents" class="events"></ul>
</dialog>

<!-- users -->
<dialog id="usersDlg" class="wide">
  <div class="dhead"><h3>Users</h3><button data-close class="icon" aria-label="Close">✕</button></div>
  <ul id="userList" class="events"></ul>
  <form id="userForm" class="inline" autocomplete="off">
    <input name="username" placeholder="username" required minlength="3" maxlength="30">
    <input name="password" type="password" placeholder="password (8+)" required minlength="8">
    <select name="role"><option value="viewer">viewer</option><option value="admin">admin</option></select>
    <button class="primary">Add user</button>
  </form>
  <p id="userErr" class="err"></p>
</dialog>

<!-- password -->
<dialog id="pwDlg">
  <form id="pwForm">
    <h3>Change password</h3>
    <label>Current password <input name="current" type="password" required autocomplete="current-password"></label>
    <label>New password (8+ characters) <input name="next" type="password" required minlength="8" autocomplete="new-password"></label>
    <p id="pwErr" class="err"></p>
    <div class="actions"><button type="button" data-close>Cancel</button><button class="primary">Update</button></div>
  </form>
</dialog>

<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
